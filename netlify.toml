# Netlify configuration for ICJIA Markdown Editor

[build]
command = "yarn generate"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
NUXT_PUBLIC_SITE_URL = "https://markdown.icjia.cloud"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
for = "/_nuxt/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
