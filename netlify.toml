# Netlify configuration for ICJIA Markdown Editor

[build]
command = "yarn generate"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
NUXT_PUBLIC_SITE_URL = "https://markdown.icjia.cloud"

# Security headers
#
# The Content-Security-Policy is NOT set here. It names the inline scripts Nuxt
# writes into each page by their SHA-256 hash, which are only known after the
# build, so `scripts/csp.mjs` writes it into dist/_headers as the last step of
# `yarn generate`. The reasoning for every directive is at the top of that file.
# Netlify applies dist/_headers and this file together; a build that cannot
# write the policy fails rather than deploying without one.
#
# Cross-Origin-Opener-Policy is the header-level backstop for links. A preview
# link is a link to wherever the document says; `same-origin` means a page opened
# from this one never receives a `window.opener` pointing back at the editor,
# whatever `target` or `rel` the link carried. The sanitizer already forces
# `rel="noopener"` on every targeted link; this holds if that is ever bypassed.
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Cross-Origin-Opener-Policy = "same-origin"

# Cache static assets
[[headers]]
for = "/_nuxt/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
